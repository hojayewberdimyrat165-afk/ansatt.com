<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<title>Aňsatt Töleg</title>
<link rel="stylesheet" href="stil.css">
</head>
<body>

<div class="card">
<h2>Aňsatt Töleg</h2>

<input type="text" placeholder="+993 Telefon belgiňiz">
<input type="number" id="manat" placeholder="Manat" oninput="hesapla()">

<select id="ulke" onchange="hesapla()">
    <option value="ru">🇷🇺 Russiýa (RUB)</option>
    <option value="tr">🇹🇷 Türkiýe (TL)</option>
</select>

<div class="total" id="sonuc">Jemi töleg: —</div>

<button class="btn">Töle</button>
</div>

<script>
function hesapla(){
    let manat = document.getElementById("manat").value;
    let ulke = document.getElementById("ulke").value;

    if(manat == "") return;

    // Sahte kurlar (sonra API ile değiştirilecek)
    let rub = 4.2;
    let tl = 0.95;

    let sonuc = ulke=="ru" ? manat * rub : manat * tl;

    // %3 komisyon
    sonuc = sonuc * 1.03;

    let para = ulke=="ru" ? "RUB" : "TL";

    document.getElementById("sonuc").innerText =
        "Jemi töleg: " + sonuc.toFixed(2) + " " + para;
}
</script>

</body>
</html>
