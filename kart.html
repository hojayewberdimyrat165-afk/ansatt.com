<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aňsatt Ödeme</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#eafff3;
    text-align:center;
}

.container{
    max-width:400px;
    background:white;
    margin:40px auto;
    padding:20px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h2{
    margin-bottom:20px;
}

input, select{
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:16px;
}

.total{
    font-size:18px;
    margin:15px 0;
    font-weight:bold;
}

button{
    width:100%;
    padding:14px;
    background:#1f9f55;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="container">
<h2>Aňsatt Ödeme</h2>

<input id="phone" placeholder="+993 Telefon numarası">
<input id="amount" type="number" placeholder="Gönderilecek tutar">

<select id="country">
<option value="tm">Türkmenistan (TM)</option>
<option value="ru">Rusya (RUB)</option>
<option value="tr">Türkiye (TL)</option>
</select>

<select id="bank">
<option>Tinkoff</option>
<option>Sberbank</option>
<option>SBP (Telefon ile)</option>
<option>Alfa Bank</option>
<option>VTB</option>
<option>Garanti</option>
<option>Ziraat</option>
<option>Papara</option>
<option>FAST</option>
</select>

<div class="total" id="total">Ödenecek: 0</div>

<button onclick="pay()">Öde</button>
</div>

<script>
const rateTM = 5.8;   // 1 Manat = 5.8 TL
const rateRU = 0.33; // 1 Ruble = 0.33 TL
const commission = 0.03; // %3 senin kazancın

document.getElementById("amount").addEventListener("input", calculate);
document.getElementById("country").addEventListener("change", calculate);

function calculate(){
    let amount = parseFloat(document.getElementById("amount").value || 0);
    let country = document.getElementById("country").value;
    let tl = 0;

    if(country=="tm") tl = amount * rateTM;
    if(country=="ru") tl = amount * rateRU;
    if(country=="tr") tl = amount;

    tl = tl + (tl * commission);

    document.getElementById("total").innerHTML = "Ödenecek: " + tl.toFixed(2) + " TL";
}

function pay(){
    let bank = document.getElementById("bank").value;
    let total = document.getElementById("total").innerText;

    alert("Aňsatt Ödeme Yönlendiriliyor\n\nBanka: "+bank+"\n"+total+"\n\nAlıcı: AÑSATT");
}
</script>

</body>
</html>
