<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aňsatt Töleg</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#eafff3;
    text-align:center;
}

.container{
    max-width:420px;
    background:white;
    margin:40px auto;
    padding:20px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h2{
    margin-bottom:20px;
}

input, select{
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:16px;
}

.total{
    font-size:18px;
    margin:15px 0;
    font-weight:bold;
}

button{
    width:100%;
    padding:14px;
    background:#1f9f55;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="container">
<h2>Aňsatt Töleg</h2>

<input id="phone" placeholder="+993 Telefon belgiňiz">
<input id="amount" type="number" placeholder="Ugradyljak mukdar">

<select id="country" onchange="updateBanks();calculate();">
<option value="tm">🇹🇲 Türkmenistan</option>
<option value="ru">🇷🇺 Russiýa</option>
<option value="tr">🇹🇷 Türkiýe</option>
</select>

<select id="bank"></select>

<div class="total" id="total">Tölenmeli: 0</div>

<button onclick="pay()">Töle</button>
</div>

<script>
const rateTM = 5.8;
const rateRU = 0.33;
const commission = 0.03;

const banks = {
    tm: ["TM Cell", "Agrobank", "Senagat Bank", "Halkbank"],
    ru: ["Tinkoff", "Sberbank", "SBP (Telefon arkaly)", "Alfa Bank", "VTB"],
    tr: ["Ziraat", "Garanti", "Papara", "FAST", "Akbank"]
};

function updateBanks(){
    let country = document.getElementById("country").value;
    let bankSelect = document.getElementById("bank");
    bankSelect.innerHTML = "";

    banks[country].forEach(bank=>{
        let opt = document.createElement("option");
        opt.text = bank;
        bankSelect.add(opt);
    });
}

document.getElementById("amount").addEventListener("input", calculate);

function calculate(){
    let amount = parseFloat(document.getElementById("amount").value || 0);
    let country = document.getElementById("country").value;
    let tl = 0;

    if(country=="tm") tl = amount * rateTM;
    if(country=="ru") tl = amount * rateRU;
    if(country=="tr") tl = amount;

    tl = tl + (tl * commission);

    document.getElementById("total").innerHTML = "Tölenmeli: " + tl.toFixed(2) + " TL";
}

function pay(){
    let bank = document.getElementById("bank").value;
    let total = document.getElementById("total").innerText;

    alert("Aňsatt tölegi\n\nBank: "+bank+"\n"+total+"\n\nAlyjy: AÑSATT");
}

updateBanks();
</script>

</body>
</html>
