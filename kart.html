<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Añsatt Töleg</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eafff3;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.box {
  background: white;
  width: 95%;
  max-width: 420px;
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  text-align: center;
}

.logo img {
  width: 70px;
  margin-bottom: 10px;
}

h2 {
  margin: 10px 0 20px;
}

input, select {
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  border-radius: 10px;
  border: 1px solid #ddd;
  font-size: 16px;
}

.total {
  margin-top: 10px;
  font-size: 18px;
  font-weight: bold;
}

button {
  margin-top: 15px;
  width: 100%;
  padding: 15px;
  background: #1db954;
  border: none;
  border-radius: 12px;
  font-size: 18px;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #169c45;
}
</style>
</head>

<body>

<div class="box">
  <div class="logo">
    <img src="logo.png">
  </div>

  <h2>Añsatt Töleg</h2>

  <input type="text" placeholder="+993 Telefon belgiňiz">
  <input type="number" id="manat" placeholder="Manat" oninput="calc()">

  <select id="country" onchange="calc()">
    <option value="rub">🇷🇺 Russiýa (RUB)</option>
    <option value="try">🇹🇷 Türkiýe (TL)</option>
  </select>

  <div class="total">
    Jemi töleg: <span id="total">—</span>
  </div>

  <button onclick="pay()">Töle</button>
</div>

<script>
function calc(){
  let manat = document.getElementById("manat").value;
  let country = document.getElementById("country").value;
  if(manat==""){
    document.getElementById("total").innerText="—";
    return;
  }

  let rate = country=="rub" ? 4.5 : 0.57; // örnek kur
  let komisyon = 1.03; // %3 senin payın
  let result = manat * rate * komisyon;

  document.getElementById("total").innerText = result.toFixed(2) + (country=="rub" ? " RUB" : " TL");
}

function pay(){
  alert("Añsatt arkaly töleg başladyldy");
}
</script>

</body>
</html>
