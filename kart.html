<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Añsatt Töleg</title>
  <style>
    body {
      background:#eafff3;
      font-family: Arial;
      margin:0;
    }
    .box {
      max-width:400px;
      margin:40px auto;
      background:white;
      padding:20px;
      border-radius:12px;
      box-shadow:0 0 10px rgba(0,0,0,.1);
    }
    input, select {
      width:100%;
      padding:12px;
      margin:8px 0;
      border-radius:8px;
      border:1px solid #ccc;
      font-size:16px;
    }
    button {
      width:100%;
      padding:14px;
      background:#1db954;
      color:white;
      border:none;
      border-radius:8px;
      font-size:18px;
    }
    .result {
      margin-top:15px;
      font-weight:bold;
      font-size:18px;
    }
  </style>
</head>

<body>
  <div class="box">
    <center>
      <img src="logo.png" width="120"><br><br>
      <h2>Añsatt Töleg</h2>
    </center>

    <input id="phone" placeholder="+993 Telefon belgiňiz">
    <input id="manat" type="number" placeholder="Manat">
    <select id="country" onchange="hesapla()">
      <option value="RU">🇷🇺 Russiýa (RUB)</option>
      <option value="TR">🇹🇷 Türkiye (TL)</option>
    </select>

    <div class="result" id="sonuc">Jemi töleg: —</div>

    <button onclick="ode()">Töle</button>
  </div>

  <script>
    let rates = {
      RUB: 5.3,
      TRY: 6.2
    };

    function hesapla(){
      let manat = document.getElementById("manat").value;
      let ulke = document.getElementById("country").value;

      if(!manat) return;

      let kur = (ulke=="RU") ? rates.RUB : rates.TRY;
      let toplam = manat * kur;
      toplam = toplam * 1.03;

      let para = (ulke=="RU") ? "₽" : "₺";
      document.getElementById("sonuc").innerHTML =
        "Jemi töleg: " + toplam.toFixed(2) + " " + para;
    }

    function ode(){
      let tel = document.getElementById("phone").value;
      let manat = document.getElementById("manat").value;

      if(tel=="" || manat==""){
        alert("Telefon we manat gir!");
        return;
      }

      window.location.href = "https://www.tinkoff.ru/pay/";
    }
  </script>
</body>
</html>
