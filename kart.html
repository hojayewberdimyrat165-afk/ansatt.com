<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<title>Añsatt Töleg</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#eafff3;
    text-align:center;
    padding:20px;
}

.container{
    max-width:420px;
    background:white;
    margin:40px auto;
    padding:20px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h2{
    margin-bottom:20px;
}

input, select{
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:16px;
}

.total{
    font-size:18px;
    margin:15px 0;
    font-weight:bold;
}

button{
    width:100%;
    padding:14px;
    background:#1f9f55;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
    margin-top:10px;
}
</style>
</head>
<body>

<div class="container">
  <h2>Añsatt Töleg</h2>

  <!-- Telefon numarası -->
  <input id="phone" placeholder="+993 Telefon belgiňiz">

  <!-- Gönderilecek miktar -->
  <input id="amount" type="number" placeholder="Ugradyljak mukdar">

  <!-- Ülke seçimi -->
  <select id="country">
    <option value="ru">🇷🇺 Russiýa</option>
    <option value="tr">🇹🇷 Türkiýe</option>
  </select>

  <!-- Sonuç gösterimi -->
  <div class="total" id="total">Tölenmeli: —</div>

  <!-- Öde butonu -->
  <button onclick="pay()">Töle</button>
</div>

<script>
// Buradaki değerleri ileride canlı kur / DoctorSIM fiyatı ile güncelleyebilirsin.
const doctorUSDperTMT = 0.055; // örnek: 1 Manat = 0.055 USD, gerçek değer güncellenmeli
const commission = 0.03;      // %3

const amountInput = document.getElementById('amount');
const countrySelect = document.getElementById('country');
const totalDiv = document.getElementById('total');

// Her miktar, ülke değiştiğinde otomatik hesapla
amountInput.addEventListener('input', calculate);
countrySelect.addEventListener('change', calculate);

function calculate(){
  const amount = parseFloat(amountInput.value || 0);
  const country = countrySelect.value;

  if(amount <= 0){
    totalDiv.innerText = "Tölenmeli: —";
    return;
  }

  // Önce USD cinsine çevir
  const usd = amount * doctorUSDperTMT * (1 + commission);

  // Kur API'si ile TL veya RUB'e çevir
  fetch("https://api.exchangerate.host/latest?base=USD")
    .then(res => res.json())
    .then(data => {
      if(country === "ru"){
        const rubRate = data.rates.RUB;
        const rubTotal = usd * rubRate;
        totalDiv.innerHTML = "Tölenmeli: <b>" + rubTotal.toFixed(2) + " RUB</b>";
      } else if(country === "tr"){
        const tlRate = data.rates.TRY;
        const tlTotal = usd * tlRate;
        totalDiv.innerHTML = "Tölenmeli: <b>" + tlTotal.toFixed(2) + " TL</b>";
      } else {
        totalDiv.innerText = "Tölenmeli: —";
      }
    })
    .catch(err => {
      // API çalışmazsa, sadece USD bilgisiyle gösterme (opsiyonel)
      console.error("Kur alırken hata:", err);
      totalDiv.innerText = "Kur alınamadı";
    });
}

function pay(){
  // Basit demo, burada ödeme yönlendirme / link ilişkilendirilir.
  // Şimdilik sadece uyarı. İleriye banka linki eklenebilir.
  alert("Ödeme işlemi başlatılacak.");
}

// Sayfa yüklendiğinde hesapla (önceki değer varsa)
calculate();
</script>

</body>
</html>
