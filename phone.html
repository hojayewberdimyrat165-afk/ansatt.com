<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Añsatt Töleg</title>
<link rel="stylesheet" href="stil.css">
</head>
<body>

<h2>Añsatt Töleg</h2>

<input id="phone" placeholder="+993 Telefon belgiňiz">
<input id="amount" type="number" placeholder="Manat" oninput="hesapla()">

<select id="country" onchange="hesapla()">
  <option value="RU">🇷🇺 Russiýa</option>
  <option value="TR">🇹🇷 Türkiýe</option>
</select>

<div id="kur"></div>

<button class="btn" onclick="ode()">Töle</button>

<script>
const KOMISYON = 1.05;

async function kurGetir(){
  const res = await fetch("https://open.er-api.com/v6/latest/TMT");
  const data = await res.json();
  return data.rates;
}

async function hesapla(){
  const manat = document.getElementById("amount").value;
  const ulke = document.getElementById("country").value;
  const kur = document.getElementById("kur");

  if(!manat) return;

  const rates = await kurGetir();
  let sonuc = 0;

  if(ulke=="RU"){
    sonuc = manat * rates.RUB * KOMISYON;
    kur.innerText = "Ödenecek: " + sonuc.toFixed(2) + " RUB";
  }

  if(ulke=="TR"){
    sonuc = manat * rates.TRY * KOMISYON;
    kur.innerText = "Ödenecek: " + sonuc.toFixed(2) + " TL";
  }
}

function ode(){
  const ulke = document.getElementById("country").value;

  if(ulke=="RU"){
    window.location.href="https://www.tinkoff.ru/payments/";
  }
  if(ulke=="TR"){
    alert("Türkiye yakında eklenecek");
  }
}
</script>

</body>
</html>
