</head>
<body>

<div class="card">
    <h2>Añsatt Töleg</h2>

    <input type="tel" id="phone" placeholder="+993 Telefon belgiňiz">
    <input type="number" id="amount" placeholder="Manat">

    <select id="country">
        <option value="ru">🇷🇺 Russiýa (RUB)</option>
        <option value="tr">🇹🇷 Türkiýe (TL)</option>
    </select>

    <div class="result" id="result">Jemi töleg: —</div>

    <button onclick="calculate()">Töle</button>
</div>

<script>
function calculate() {
    let manat = document.getElementById("amount").value;
    let country = document.getElementById("country").value;

    if (manat === "") {
        alert("Mukdary giriziň");
        return;
    }

    let rate;
    let currency;

    if (country === "ru") {
        rate = 3.2; // 1 manat = 3.2 RUB (örnek)
        currency = "₽";
    } else {
        rate = 1.8; // 1 manat = 1.8 TL (örnek)
        currency = "₺";
