<!DOCTYPE html>
<html>
<head>
  <title>Aňsatt</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="font-family:sans-serif;text-align:center;padding:20px">

<h1>Aňsatt</h1>

<input id="phone" placeholder="TM Cell numara" style="width:90%;padding:10px"><br><br>

<input id="amount" placeholder="Tutar (TMT)" type="number" style="width:90%;padding:10px"><br><br>

<select id="currency">
  <option value="TRY">TL</option>
  <option value="RUB">RUB</option>
</select><br><br>

<button onclick="calculate()">Hesapla</button>

<h2 id="price"></h2>

<button id="pay" style="display:none" onclick="pay()">Öde</button>

<script>
async function calculate(){
  let phone = phone.value;
  let amount = amount.value;
  let currency = document.getElementById("currency").value;

  let res = await fetch("https://YOUR_WORKER_URL/calc?amount="+amount+"&currency="+currency);
  let data = await res.json();

  window.payUrl = data.payUrl;

  document.getElementById("price").innerText = "Ödenecek: " + data.price + " " + currency;
  document.getElementById("pay").style.display = "block";
}

function pay(){
  window.location.href = window.payUrl;
}
</script>

</body>
</html>
